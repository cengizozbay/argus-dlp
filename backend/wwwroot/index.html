<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus · Yönetim Konsolu</title>
<style>
  :root{
    --bg:#F3F5F8;--bg2:#FFFFFF;--surface:#FFFFFF;--surface2:#F5F8FA;--surface3:#EAEEF3;
    --border:#E1E7EE;--border-soft:#EDF1F6;--text:#18242F;--dim:#5A6A79;--faint:#8B99A7;
    --accent:#0E9E8E;--accent-d:rgba(14,158,142,.10);--good:#17A34A;--warn:#C07C00;--crit:#DC3B34;--info:#2563C9;
    --good-d:rgba(23,163,74,.11);--warn-d:rgba(192,124,0,.13);--crit-d:rgba(220,59,52,.10);--info-d:rgba(37,99,201,.10);--purple:#8B5CF6;--purple-d:rgba(139,92,246,.12);
    --shadow:0 1px 2px rgba(24,44,64,.05),0 2px 6px rgba(24,44,64,.05);
    --shadow-lg:0 12px 44px rgba(24,44,64,.16);
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Code",ui-monospace,Consolas,monospace;--sb:244px;--tb:58px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;border:2px solid var(--bg)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}

  /* sidebar */
  .sidebar{background:var(--bg2);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--border-soft);height:var(--tb)}
  .brand b{font-size:15px;font-weight:650;letter-spacing:.02em}.brand b span{color:var(--accent)}
  .brand small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);margin-top:1px}
  nav{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:3px}
  .nlabel{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);padding:14px 12px 6px;font-weight:600}
  .nav-item{position:relative;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:7px;color:var(--dim);font-size:13.5px;font-weight:500;border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer;transition:background .12s,color .12s}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.on{background:var(--accent-d);color:var(--text);border-color:rgba(14,158,142,.20)}
  .nav-item.on::before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .nav-item.on .ic{color:var(--accent)}
  .ic{width:17px;height:17px;flex:0 0 auto;color:var(--faint)}
  .nav-item.on .ic,.nav-item:hover .ic{color:var(--dim)}
  .nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--crit-d);color:var(--crit);font-variant-numeric:tabular-nums}
  .foot{border-top:1px solid var(--border-soft);padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .foot .b{width:26px;height:26px;border-radius:7px;background:var(--good-d);color:var(--good);display:grid;place-items:center;flex:0 0 auto}

  /* topbar */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:var(--tb);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);z-index:20}
  .search{flex:0 1 340px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--faint)}
  .search input{background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13.5px;width:100%}
  .sp{flex:1}
  .keyfield{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px 4px 11px}
  .keyfield span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
  .keyfield input{background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12px;width:170px}
  /* Kullanıcı çipi + giriş */
  .uchip{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 6px 4px 11px}
  .uchip .un{font-weight:600;font-size:12.5px;color:var(--text);line-height:1.15}
  .uchip .ur{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .uchip .lo{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer}
  .uchip .lo:hover{color:var(--crit);border-color:var(--crit)}
  .rolepill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 8px;border-radius:20px;background:var(--accent-d);color:var(--accent);text-transform:uppercase}
  .hide-role{display:none!important}
  #loginOverlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .loginbox{width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .loginbox h2{font-size:19px;margin:14px 0 3px}
  .loginbox p{font-size:12.5px;color:var(--faint);margin-bottom:20px}
  .loginbox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:0 0 5px}
  .loginbox input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13.5px;margin-bottom:14px;outline:none}
  .loginbox input:focus{border-color:var(--accent)}
  .loginbox .remember{display:flex;align-items:center;gap:8px;font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--dim);margin:0 0 14px;cursor:pointer}
  .loginbox .remember input{width:auto;margin:0;cursor:pointer}
  .loginbox button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:4px}
  .loginbox button:disabled{opacity:.6}
  .loginerr{color:var(--crit);font-size:12px;min-height:16px;margin-top:8px;text-align:center}
  /* Agent durum rozetleri */
  .ast{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.02em}
  .ast.online{background:var(--good-d);color:var(--good)}.ast.offline{background:var(--surface3);color:var(--faint)}
  .ast.active{background:var(--accent-d);color:var(--accent)}.ast.disabled{background:var(--warn-d);color:var(--warn)}.ast.remove{background:var(--crit-d);color:var(--crit)}
  .abtn{background:var(--surface2);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;margin-right:6px}
  .abtn:hover{color:var(--text)}.abtn.danger:hover{color:var(--crit);border-color:var(--crit)}.abtn.go:hover{color:var(--accent);border-color:var(--accent)}
  .codebox{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:var(--text);white-space:pre-wrap;word-break:break-all;user-select:all}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 13px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.on{background:var(--good);animation:p 2.4s infinite}.dot.off{background:var(--crit)}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(23,163,74,.40)}70%{box-shadow:0 0 0 7px rgba(23,163,74,0)}100%{box-shadow:0 0 0 0 rgba(23,163,74,0)}}
  .ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--dim);cursor:pointer}
  .ibtn:hover{background:var(--surface2);color:var(--text)}

  /* content */
  .content{padding:22px;overflow-x:hidden}
  .view{display:none}.view.on{display:block;animation:f .2s ease}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:680;letter-spacing:-.01em;margin:0}
  .sub{color:var(--dim);margin-top:3px}
  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:3px;gap:2px;box-shadow:var(--shadow)}
  .seg button{background:none;border:none;color:var(--dim);padding:5px 13px;border-radius:5px;font-size:12px;font-weight:550;cursor:pointer}
  .seg button.on{background:var(--surface3);color:var(--text)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:16px 17px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:600}
  .kpi .v{font-size:29px;font-weight:680;letter-spacing:-.02em;margin-top:8px;line-height:1;display:flex;align-items:baseline;gap:6px}
  .kpi .v small{font-size:13px;font-weight:500;color:var(--faint)}
  .kpi .m{margin-top:9px;font-size:12px;color:var(--dim)}
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
  .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft)}
  .ph b{font-size:15px;font-weight:620}.ph .bd{font-size:12px;color:var(--faint)}
  .link{background:none;border:none;color:var(--accent);font-size:12px;font-weight:550;cursor:pointer}.link:hover{text-decoration:underline}

  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:11px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface2)}
  .click:hover .mach{color:var(--accent)}
  .mach{font-weight:600}.u{font-size:11px;color:var(--faint)}
  .st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550}.st .d{width:8px;height:8px;border-radius:50%}
  .st.on{color:var(--good)}.st.on .d{background:var(--good)}.st.off{color:var(--faint)}.st.off .d{background:var(--faint)}
  .bar{display:flex;align-items:center;gap:9px;min-width:150px}
  .track{flex:1;height:6px;border-radius:4px;background:var(--surface3);overflow:hidden;display:flex}.track i{height:100%;display:block}
  .bn{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
  .bn.c{background:var(--crit-d);color:var(--crit)}.bn.i{background:var(--info-d);color:var(--info)}.bn.z{color:var(--faint)}
  .op{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .op.delete{background:var(--crit-d);color:var(--crit)}.op.copy{background:var(--purple-d);color:var(--purple)}
  .op.create{background:var(--good-d);color:var(--good)}.op.modify{background:var(--warn-d);color:var(--warn)}.op.rename{background:var(--surface3);color:var(--dim)}
  .op.usb_copy{background:var(--crit-d);color:var(--crit)}.op.usb_insert{background:var(--info-d);color:var(--info)}.op.usb_remove{background:var(--surface3);color:var(--dim)}
  .path{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .fname{font-family:var(--mono);font-size:12px;color:var(--text);font-weight:600}
  .fdest{font-family:var(--mono);font-size:11px;margin-left:4px;padding:1px 7px;border-radius:5px;background:var(--surface3);color:var(--dim);white-space:nowrap}
  .fdest.usb{background:var(--crit-d);color:var(--crit)}
  .fdest.del{background:var(--warn-d);color:var(--warn)}
  .fdir{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
  .u2{font-size:11px;color:var(--faint);margin-top:2px}
  .ev-row{cursor:pointer}
  .ev-row:hover td{background:var(--surface2)}
  .ev-row .chev{float:right;color:var(--faint);transition:transform .15s;font-size:11px}
  .ev-row.open .chev{transform:rotate(180deg)}
  .ev-detail>td{background:var(--surface2);padding:0!important}
  .evdetail{display:grid;grid-template-columns:150px 1fr;gap:2px 14px;padding:14px 18px;font-size:12.5px}
  .evd-k{color:var(--faint);text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;padding-top:3px}
  .evd-v{color:var(--text);font-family:var(--mono);font-size:12px;word-break:break-all}
  .evd-v.hot{color:var(--crit);font-weight:600}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--text)}
  th.sortable .ar{opacity:.4;font-size:9px;margin-left:3px}
  th.sortable.act .ar{opacity:1;color:var(--accent)}
  .dtool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
  .dtool input[type=date]{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;outline:none}
  .dtool .dd-q{flex:1;min-width:150px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--text);font-size:12.5px;outline:none}
  .dtool .dd-q:focus{border-color:var(--accent)}
  .time{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .incog{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:5px;background:var(--crit-d);color:var(--crit)}
  .sens{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:5px;background:var(--crit-d);color:var(--crit);margin-left:7px;white-space:nowrap;vertical-align:middle}
  tr[data-sens="1"] .path{color:var(--crit)}
  .normal{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:5px;background:rgba(147,161,176,.13);color:var(--dim)}
  .wl{display:inline-flex;align-items:center;gap:7px;font-weight:550}
  .fav{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#08161a;background:var(--accent);flex:0 0 auto}

  .feed .a{display:grid;grid-template-columns:3px 1fr auto;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border-soft);align-items:flex-start}
  .feed .a:last-child{border-bottom:none}
  .stripe{border-radius:3px;align-self:stretch}.s-critical{background:var(--crit)}.s-warning{background:var(--warn)}.s-info{background:var(--info)}
  .a .t{font-weight:600;margin-bottom:2px}.a .d{font-size:12px;color:var(--dim)}
  .a .meta{font-size:11px;color:var(--faint);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:2px 7px;border-radius:5px}
  .chip.critical{background:var(--crit-d);color:var(--crit)}.chip.warning{background:var(--warn-d);color:var(--warn)}.chip.info{background:var(--info-d);color:var(--info)}

  .empty{padding:44px 20px;text-align:center;color:var(--dim)}.empty b{color:var(--text);display:block;margin-bottom:5px}
  .apps{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .aw .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}.aw .top .n{font-weight:550}.aw .top .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .aw .tr{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden}.aw .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}

  .drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:94vw;background:var(--bg2);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .2s;z-index:40;display:flex;flex-direction:column;overflow:auto}
  .drawer.open{transform:none}
  .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-soft)}.dh b{font-size:16px}
  .x{background:none;border:none;color:var(--faint);font-size:22px;cursor:pointer;line-height:1}.x:hover{color:var(--text)}
  .wr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border-soft)}
  .wr:last-child{border-bottom:none}.wr a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wr .tt{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .kpi{position:relative;overflow:hidden}
  .sparkwrap{position:absolute;right:12px;bottom:10px;width:90px;height:30px;opacity:.9;pointer-events:none}
  .spark{width:90px;height:30px;display:block}
  .unrow{display:grid;grid-template-columns:34px 1.5fr 1fr 46px;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer}
  .unrow:last-child{border-bottom:none}.unrow:hover{background:var(--surface2)}.unrow:hover .mach{color:var(--accent)}
  .rank{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--faint);text-align:center}.rank.top{color:var(--crit)}
  .prodw{min-width:0}.prodt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:6px}
  .prodbar{height:6px;border-radius:4px;background:var(--surface3);overflow:hidden}.prodbar i{display:block;height:100%;border-radius:4px}
  .vscore{font-weight:700;font-size:14px;padding:4px 0;border-radius:7px;text-align:center;font-variant-numeric:tabular-nums}
  .subtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--border-soft)}
  .subtab{background:none;border:none;color:var(--dim);font-size:13px;font-weight:550;padding:11px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;gap:7px;align-items:center}
  .subtab.on{color:var(--text);border-bottom-color:var(--accent)}
  .subtab .c{font-size:11px;color:var(--faint);background:var(--surface2);border-radius:20px;padding:0 7px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px 24px;padding:16px 18px}
  .frow{display:flex;flex-direction:column;gap:5px}
  .frow label{font-size:12.5px;font-weight:550;color:var(--text);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .frow .fh{font-weight:400;color:var(--faint);font-size:11px}
  .frow input,.frow select,.frow textarea{background:var(--surface2);border:1px solid var(--border-soft);border-radius:7px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;width:100%}
  .frow textarea{min-height:74px;resize:vertical;font-family:var(--mono);font-size:12px}
  .frow.wide{grid-column:1 / -1}
  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text);cursor:pointer}
  .toggle input{width:auto}
  .savebar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--border-soft)}
  .savebar .msg{font-size:12.5px;color:var(--dim)}
  .subpane{display:none}.subpane.on{display:block}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);padding:4px 16px 0}
  .rptool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
  .rplbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .rptool select,.rptool input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-family:inherit;font-size:12.5px;color-scheme:light}
  .rptool select:focus,.rptool input:focus{outline:none;border-color:var(--accent)}
  .db-presets{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px}
  .db-presets button{background:none;border:none;color:var(--dim);padding:5px 11px;border-radius:5px;font-size:12px;font-weight:550;cursor:pointer}
  .db-presets button:hover{color:var(--text)}
  .btn{background:var(--accent-d);border:1px solid rgba(52,211,192,.3);color:var(--accent);border-radius:6px;padding:6px 14px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:rgba(52,211,192,.18)}
  .u2{color:var(--dim)}
  .cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
  .risk{display:flex;align-items:center;gap:16px;padding:17px 20px;border-radius:12px;margin-bottom:18px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
  .risk .rico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
  .risk .rt{font-size:15.5px;font-weight:670;letter-spacing:-.01em}
  .risk .rd{font-size:12.5px;color:var(--dim);margin-top:2px}
  .risk .rlvl{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 13px;border-radius:20px;white-space:nowrap}
  .risk.high{border-color:rgba(220,59,52,.30);background:linear-gradient(90deg,rgba(220,59,52,.055),var(--surface) 55%)}
  .risk.high .rico,.risk.high .rlvl{background:var(--crit-d);color:var(--crit)}
  .risk.mid{border-color:rgba(192,124,0,.30);background:linear-gradient(90deg,rgba(192,124,0,.06),var(--surface) 55%)}
  .risk.mid .rico,.risk.mid .rlvl{background:var(--warn-d);color:var(--warn)}
  .risk.low{border-color:rgba(23,163,74,.28);background:linear-gradient(90deg,rgba(23,163,74,.055),var(--surface) 55%)}
  .risk.low .rico,.risk.low .rlvl{background:var(--good-d);color:var(--good)}
  @media(max-width:1080px){.grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>

<div id="loginOverlay" style="display:none">
  <form class="loginbox" id="loginForm" autocomplete="off">
    <svg width="34" height="34" viewBox="0 0 30 30" fill="none"><path d="M2 15C4.5 9 9.4 6 15 6s10.5 3 13 9c-2.5 6-7.4 9-13 9S4.5 21 2 15Z" stroke="#0E9E8E" stroke-width="1.7"/><circle cx="15" cy="15" r="4.4" fill="#0E9E8E" fill-opacity=".15" stroke="#0E9E8E" stroke-width="1.7"/><circle cx="15" cy="15" r="1.7" fill="#0E9E8E"/></svg>
    <h2>Argus Yönetim Konsolu</h2>
    <p>Devam etmek için giriş yapın</p>
    <label>Kullanıcı adı</label>
    <input id="liUser" autocomplete="username" spellcheck="false" autofocus>
    <label>Parola</label>
    <input id="liPass" type="password" autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="liRemember" checked> Beni hatırla (30 gün açık kal)</label>
    <button type="submit" id="liBtn">Giriş yap</button>
    <div class="loginerr" id="liErr"></div>
  </form>
  <form class="loginbox" id="pwForm" style="display:none" autocomplete="off">
    <svg width="34" height="34" viewBox="0 0 30 30" fill="none"><path d="M2 15C4.5 9 9.4 6 15 6s10.5 3 13 9c-2.5 6-7.4 9-13 9S4.5 21 2 15Z" stroke="#0E9E8E" stroke-width="1.7"/><circle cx="15" cy="15" r="4.4" fill="#0E9E8E" fill-opacity=".15" stroke="#0E9E8E" stroke-width="1.7"/><circle cx="15" cy="15" r="1.7" fill="#0E9E8E"/></svg>
    <h2>Parola Değiştir</h2>
    <p>Güvenlik için yeni bir parola belirleyin</p>
    <label>Mevcut parola</label>
    <input id="pwCur" type="password" autocomplete="current-password">
    <label>Yeni parola (en az 6 karakter)</label>
    <input id="pwNew" type="password" autocomplete="new-password">
    <label>Yeni parola (tekrar)</label>
    <input id="pwNew2" type="password" autocomplete="new-password">
    <button type="submit" id="pwBtn">Kaydet ve gir</button>
    <div class="loginerr" id="pwErr"></div>
  </form>

<script>
(function(){
  "use strict";
  var TOK_LS="argus_session";
  // "Beni hatırla" işaretliyse localStorage (tarayıcı kapansa da kalır), değilse sessionStorage (sekme kapanınca gider).
  var session=localStorage.getItem(TOK_LS)||sessionStorage.getItem(TOK_LS)||"", me={role:"viewer",displayName:"",username:""};
  function storeSession(tok,remember){ session=tok; localStorage.removeItem(TOK_LS); sessionStorage.removeItem(TOK_LS); (remember?localStorage:sessionStorage).setItem(TOK_LS,tok); }
  function clearSession(){ session=""; localStorage.removeItem(TOK_LS); sessionStorage.removeItem(TOK_LS); }
  document.getElementById("reload").addEventListener("click",refresh);
  var q=document.getElementById("q"); q.addEventListener("input",function(){ gq=q.value.trim().toLowerCase(); applyFilters(); });

  var state={agents:[],alerts:[],events:[],web:[],apps:[],appusage:[],settings:null}, gq="", view="ozet", seg={};
  var C={accent:"#0E9E8E",good:"#17A34A",warn:"#C07C00",crit:"#DC3B34",info:"#2563C9"};
  var hist={online:[],active:[],alerts:[],deletes:[],copies:[]}, uid=0;

  function hdr(extra){ var h=extra||{}; if(session) h["X-Session"]=session; return h; }
  function onAuthFail(){ clearSession(); showLogin(); }
  function api(p){ return fetch("/api/v1"+p,{headers:hdr()}).then(function(r){ if(r.status===401){ onAuthFail(); throw new Error("401"); } if(!r.ok) throw new Error(r.status); return r.json(); }); }
  function apiSend(p,method,body){ return fetch("/api/v1"+p,{method:method,headers:hdr({"Content-Type":"application/json"}),body:body==null?null:JSON.stringify(body)}).then(function(r){ if(r.status===401){ onAuthFail(); throw new Error("401"); } if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||r.status); },function(){ throw new Error(r.status); }); return r.json(); }); }

  // ---------- GİRİŞ / OTURUM ----------
  function showLogin(){ document.getElementById("loginOverlay").style.display="flex"; document.getElementById("loginForm").style.display=""; document.getElementById("pwForm").style.display="none"; document.getElementById("liUser").focus(); }
  function hideLogin(){ document.getElementById("loginOverlay").style.display="none"; }
  function showChangePw(curPass){ document.getElementById("loginOverlay").style.display="flex"; document.getElementById("loginForm").style.display="none"; document.getElementById("pwForm").style.display=""; document.getElementById("pwCur").value=curPass||""; document.getElementById("pwErr").textContent=""; (curPass?document.getElementById("pwNew"):document.getElementById("pwCur")).focus(); }
  function roleRank(r){ return {superadmin:4,owner:3,admin:2,viewer:1}[r]||0; }
  function applyRole(){
    document.getElementById("uName").textContent=me.displayName||me.username;
    document.getElementById("uRole").innerHTML='<span class="rolepill">'+({superadmin:"Platform",owner:"Patron",admin:"Yönetici",viewer:"İzleyici"}[me.role]||me.role)+'</span>';
    var rk=roleRank(me.role);
    document.querySelectorAll(".nav-admin").forEach(function(n){ n.classList.toggle("hide-role",rk<2); });
    document.querySelectorAll(".nav-owner").forEach(function(n){ n.classList.toggle("hide-role",rk<3); });
    document.querySelectorAll(".nav-super").forEach(function(n){ n.classList.toggle("hide-role",rk<4); });
  }
  document.getElementById("loginForm").addEventListener("submit",function(e){
    e.preventDefault();
    var u=document.getElementById("liUser").value.trim(), p=document.getElementById("liPass").value;
    var remember=document.getElementById("liRemember").checked;
    var btn=document.getElementById("liBtn"), err=document.getElementById("liErr");
    btn.disabled=true; err.textContent="";
    fetch("/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p,remember:remember})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){ btn.disabled=false;
        if(!res.ok){ err.textContent=res.j.error||"Giriş başarısız"; return; }
        storeSession(res.j.token,remember);
        me={role:res.j.role,displayName:res.j.displayName,username:res.j.username,tenantKey:res.j.tenantKey};
        document.getElementById("liPass").value="";
        if(res.j.mustChangePassword){ showChangePw(p); return; }   // ilk giriş → parola değiştir
        hideLogin(); applyRole(); boot();
      })
      .catch(function(){ btn.disabled=false; err.textContent="Sunucuya ulaşılamadı"; });
  });
  document.getElementById("pwForm").addEventListener("submit",function(e){
    e.preventDefault();
    var cur=document.getElementById("pwCur").value, n1=document.getElementById("pwNew").value, n2=document.getElementById("pwNew2").value;
    var btn=document.getElementById("pwBtn"), err=document.getElementById("pwErr");
    if(n1.length<6){ err.textContent="Yeni parola en az 6 karakter olmalı"; return; }
    if(n1!==n2){ err.textContent="Yeni parolalar eşleşmiyor"; return; }
    btn.disabled=true; err.textContent="";
    apiSend("/auth/change-password","POST",{currentPassword:cur,newPassword:n1}).then(function(){
      btn.disabled=false; document.getElementById("pwNew").value=""; document.getElementById("pwNew2").value="";
      hideLogin(); applyRole(); boot();
    }).catch(function(ex){ btn.disabled=false; err.textContent=ex.message||"Değiştirilemedi"; });
  });
  document.getElementById("logout").addEventListener("click",function(){
    apiSend("/auth/logout","POST",{}).catch(function(){}); onAuthFail();
  });
  function fmt(s){ s=s||0; var h=Math.floor(s/3600),m=Math.floor(s%3600/60); return h>0?h+"s "+m+"d":(m+"d "+(s%60)+"sn"); }
  function ago(iso){ var s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000); if(s<60)return Math.floor(s)+" sn önce"; if(s<3600)return Math.floor(s/60)+" dk önce"; if(s<86400)return Math.floor(s/3600)+" sa önce"; return Math.floor(s/86400)+" gün önce"; }
  function esc(t){ return (t||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function isHost(d){ return !!d && d.indexOf(' ')<0 && /^[a-z0-9.\-]+\.[a-z]{2,}$/i.test(d); }
  function webLabel(w){ var t=(w.title||"").trim(); return t || (isHost(w.domain)?w.domain:"—"); }
  // Başlıkta geçen domaini çıkar (ör. "Video - Pornhub.com" → pornhub.com) — link doğrudan siteye gitsin.
  function guessHost(title){ if(!title) return null; var m=String(title).match(/([a-z0-9][a-z0-9\-]*\.(?:com\.tr|gov\.tr|org\.tr|net\.tr|com|net|org|tv|io|co|xyz|info|gg|to|me))\b/i); return m?m[1].toLowerCase():null; }
  function webHref(w){ var l=w.url||(isHost(w.domain)?("https://"+w.domain):null); if(!l){ var g=guessHost(w.title); if(g) l="https://"+g; } if(l && !/^https?:\/\//i.test(l)) l="https://"+l; return l; }
  function webCell(w){
    var lbl=webLabel(w), href=webHref(w), init=esc(((lbl||"?").charAt(0)||"?").toUpperCase());
    if(href) return '<a class="wl" href="'+esc(href)+'" target="_blank" rel="noopener"><span class="fav">'+init+'</span>'+esc(lbl)+'</a>';
    // Tam URL yok (uzantı kurulu değil) → başlığı Google'da aratıp siteye ulaştır.
    if(w.title){ var s="https://www.google.com/search?q="+encodeURIComponent(w.title);
      return '<a class="wl" href="'+esc(s)+'" target="_blank" rel="noopener" title="Tam URL yok — başlıkla aratır (uzantı kurulursa doğrudan sayfaya gider)"><span class="fav" style="background:var(--surface3);color:var(--dim)">'+init+'</span>'+esc(lbl)+' <span style="font-size:10px;color:var(--faint)">⌕</span></a>'; }
    return '<span class="wl"><span class="fav" style="background:var(--surface3);color:var(--dim)">'+init+'</span>'+esc(lbl)+'</span>';
  }
  function kpi(l,v,m,c){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v num" style="color:'+(c||"var(--text)")+'">'+v+'</div><div class="m">'+m+'</div></div>'; }
  function kpiS(l,v,m,data,col){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v num" style="color:'+col+'">'+v+'</div><div class="m">'+m+'</div><div class="sparkwrap">'+spark(data,col)+'</div></div>'; }

  function spark(data,col){
    if(!data||data.length<2) return '';
    var w=90,h=30,p=2,mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=(mx-mn)||1,sx=(w-p*2)/(data.length-1);
    var pts=data.map(function(v,i){ return (p+i*sx).toFixed(1)+","+(h-p-((v-mn)/rng)*(h-p*2)).toFixed(1); });
    var d="M"+pts.join(" L"), area=d+" L"+(w-p).toFixed(1)+","+h+" L"+p+","+h+" Z", id="sp"+(uid++);
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#'+id+')"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.6"/></svg>';
  }
  function areaChart(data,col){
    if(!data||data.length<2) return '<div class="empty">Grafik için veri toplanıyor… (birkaç saniye)</div>';
    var w=680,h=170,p=10,mx=Math.max.apply(null,data)||1,sx=(w-p*2)/(data.length-1);
    var y=function(v){ return h-p-(v/mx)*(h-p*2-8); };
    var pts=data.map(function(v,i){ return (p+i*sx).toFixed(1)+","+y(v).toFixed(1); });
    var d="M"+pts.join(" L"), area=d+" L"+(p+(data.length-1)*sx).toFixed(1)+","+(h-p)+" L"+p+","+(h-p)+" Z";
    var lx=(p+(data.length-1)*sx), ly=y(data[data.length-1]), grid="";
    for(var g=0;g<=3;g++){ var gy=(p+g*((h-p*2-8)/3)).toFixed(1); grid+='<line x1="'+p+'" y1="'+gy+'" x2="'+(w-p)+'" y2="'+gy+'" stroke="#E6ECF2"/>'; }
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:170px"><defs><linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#ac)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3.5" fill="'+col+'"/></svg>';
  }
  function donutTime(act,idle){

  // Kişi + tarih filtresini bir ekrana bağlar ve veriyi /report/* ucundan çeker.
  // opts.state    : filtrenin saklanacağı nesne (varsayılan aktFilter — Aktivite sekmeleri ortak kullanır)
  // opts.pageSize : >0 ise sayfalama açılır; onData'ya ikinci argüman {hasMore, loadMore} gelir.
  //                 Böylece ekran sunucunun tavanına takılmaz, "daha fazla yükle" ile geçmişe iner.
  // opts.extra    : ek sorgu dizesi üreten fonksiyon (ör. "&op=usb")
  function wireReport(v,onData,endpoint,opts){
    endpoint=endpoint||"/report/web"; opts=opts||{};
    var st=opts.state||aktFilter, pageSize=opts.pageSize||0;
    var person=v.querySelector(".rp-person"),from=v.querySelector(".rp-from"),to=v.querySelector(".rp-to"),apply=v.querySelector(".rp-apply");
    var page=0, acc=[];
    function load(more){
      if(!more){ page=0; acc=[]; }
      st.person=person.value; st.from=from.value; st.to=to.value;
      var q=endpoint+"?agent="+encodeURIComponent(person.value)+"&from="+from.value+"&to="+to.value+(opts.extra?opts.extra():"");
      if(pageSize) q+="&limit="+pageSize+"&offset="+(page*pageSize);
      api(q).then(function(rows){
        rows=rows||[];
        acc = more ? acc.concat(rows) : rows;
        onData(acc,{ hasMore: pageSize>0 && rows.length===pageSize, loadMore: function(){ page++; load(true); } });
      }).catch(function(){ onData(more?acc:[],{hasMore:false}); });
    }
    function run(){ load(false); }
    apply.onclick=run; person.onchange=run;
    v.querySelectorAll(".db-presets button").forEach(function(b){ b.onclick=function(){ var d=+b.getAttribute("data-days"); from.value=daysAgo(d); to.value=today(); run(); }; });
    run();
    return { reload: run };
  }

  function classify(text){
    var d=(text||"").toLowerCase();

    // 2) Anahtar kelime (başlık ya da domain metni içinde).
    for(var j=0;j<KW.length;j++){ for(var k=0;k<KW[j][2].length;k++){ if(d.indexOf(KW[j][2][k])>=0) return {cat:KW[j][0],c:KW[j][1]}; } }

  function fileDetail(e){
    var b=pathBits(e.path), kv=[];

    kv.push(["Dosya",b.name||e.path||"—",false]);

    if(e.op==="copy") kv.push(["Nereden (kaynak)",e.source||"— (eski kayıt / tespit edilemedi)",false]);

    else if(e.source) kv.push(["Nereden (kaynak)",e.source,false]);
    if(e.op==="usb_copy") kv.push(["Nereye",(e.path||"").slice(0,2)+" (USB) · "+(b.dir||""),true]);
    else if(e.op==="copy") kv.push(["Nereye (hedef)",b.dir||"—",false]);
    else if(e.op!=="usb_insert"&&e.op!=="usb_remove") kv.push(["Konum",b.dir||"—",false]);
    if(e.path) kv.push(["Tam yol",e.path,false]);
    if(e.sensitivity) kv.push(["Hassas içerik",e.sensitivity,true]);
    if(e.user) kv.push(["Kullanıcı (yapan)",e.user,false]);

  // ESKİDEN: bu ekran canlı /events + /alerts anlık görüntüsünden (son 200 kayıt) besleniyordu.
  // 300 makinede son 200 olay birkaç dakikayı kapsar → dünkü USB hareketi ekranda YOKTU.
  // ARTIK: kişi + tarih filtreli, doğrudan veritabanı geçmişinden (/report/*) okur.
  function isDlpAlert(a){ var t=(a.alert&&a.alert.type)||""; return t==="usb_exfil"||t==="mass_copy"||t==="mass_delete"||t==="sensitive_exfil"||t==="web_policy"; }
  var dlpFilter={person:"",from:daysAgo(29),to:today()};
  var dlpData={usb:[],sens:[],alerts:[]};

  function renderGuvenlik(){
    var v=document.getElementById("v-guvenlik");
    v.innerHTML=
      '<div class="head"><div><h1>Veri Güvenliği</h1><div class="sub">Veri sızıntısı riski · hassas içerik, USB, toplu kopyalama ve silme izleme (DLP)</div></div><button class="btn rp-csv">CSV indir</button></div>'+
      reportToolbar(dlpFilter.person,dlpFilter.from,dlpFilter.to)+
      '<div id="dlpBody"><div class="panel"><div class="empty">Yükleniyor…</div></div></div>';
    var person=v.querySelector(".rp-person"),from=v.querySelector(".rp-from"),to=v.querySelector(".rp-to"),apply=v.querySelector(".rp-apply");
    function qs(extra){ return "?agent="+encodeURIComponent(person.value)+"&from="+from.value+"&to="+to.value+extra; }
    function load(){
      dlpFilter.person=person.value; dlpFilter.from=from.value; dlpFilter.to=to.value;
      var nope=function(){ return []; };
      Promise.all([
        api("/report/events"+qs("&op=usb&limit=2000")).catch(nope),
        api("/report/events"+qs("&sensitive=true&limit=2000")).catch(nope),
        api("/report/alerts"+qs("&limit=1000")).catch(nope)
      ]).then(function(r){
        dlpData={usb:r[0]||[], sens:r[1]||[], alerts:(r[2]||[]).filter(isDlpAlert)};
        drawGuvenlik();
      });
    }
    apply.onclick=load; person.onchange=load;
    v.querySelectorAll(".db-presets button").forEach(function(b){ b.onclick=function(){ var d=+b.getAttribute("data-days"); from.value=daysAgo(d); to.value=today(); load(); }; });
    v.querySelector(".rp-csv").onclick=function(){
      csvDownload("argus-veri-guvenligi.csv","Zaman,Makine,Kullanici,Islem,Hassas,Yol",
        dlpData.usb.concat(dlpData.sens),function(e){
          return [csvCell(fmtTs(e.ts)),csvCell(e.machine),csvCell(e.user),csvCell(opLabel(e.op)),
                  csvCell(e.sensitivity),csvCell(e.path)].join(",");
        });
    };
    load();
  }

  function drawGuvenlik(){
    if(!document.getElementById("dlpBody")) return;   // ekran henüz kurulmadı (canlı tik erken geldi)
    var ue=dlpData.usb;
    var ins=ue.filter(function(e){return e.op==="usb_insert";}).length;
    var cop=ue.filter(function(e){return e.op==="usb_copy";}).length;
    var se=dlpData.sens;
    var sensN=se.length;
    var da=dlpData.alerts;
    var critCopy=da.filter(function(a){var t=a.alert.type;return t==="usb_exfil"||t==="mass_copy";}).length;
    var critDel=da.filter(function(a){return a.alert.type==="mass_delete";}).length;
    var critSens=da.filter(function(a){return a.alert.type==="sensitive_exfil";}).length;

    var lvl=(sensN>0||cop>0||critCopy>0||critSens>0||da.some(function(a){return a.alert.severity==="critical";}))?"high"
           :(ins>0||ue.length>0||da.length>0)?"mid":"low";
    var rm={
      high:{cls:"high",t:"Yüksek risk — hassas veri dışarı taşınmış olabilir",d:sensN+" hassas dosya · "+cop+" dosya USB'ye · "+da.length+" DLP uyarısı",lbl:"Yüksek"},
      mid:{cls:"mid",t:"Orta risk — izlenmesi gereken hareket var",d:ins+" USB bağlantısı · "+da.length+" DLP uyarısı",lbl:"Orta"},
      low:{cls:"low",t:"Veri sızıntısı sinyali yok",d:"Hassas içerik, USB'ye kopyalama veya toplu hareket tespit edilmedi",lbl:"Düşük"}
    }[lvl];
    var shield='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 5.5v6c0 4.6 3.1 8 7 9 3.9-1 7-4.4 7-9v-6L12 3Z"/><path d="M9.2 12l1.9 1.9 3.7-3.9"/></svg>';
    var risk='<div class="risk '+rm.cls+'"><div class="rico">'+shield+'</div><div><div class="rt">'+rm.t+'</div><div class="rd">'+rm.d+'</div></div><div class="rlvl">'+rm.lbl+' risk</div></div>';

    var kpis='<div class="kpis">'+
      kpi("Hassas Dosya",sensN,"TC / IBAN / kart içeren",sensN?"var(--crit)":"var(--text)")+
      kpi("USB'ye Kopyalanan",cop,"dosya · sızıntı sinyali",cop?"var(--crit)":"var(--text)")+
      kpi("Hassas Sızıntı Uyarısı",critSens,"içerik dışarı taşındı",critSens?"var(--crit)":"var(--text)")+
      kpi("Toplu Silme Uyarısı",critDel,"veri imhası",critDel?"var(--warn)":"var(--text)")+'</div>';

    var perM={};
    ue.forEach(function(e){ if(e.op==="usb_copy"){ var m=e.machine||"?"; perM[m]=(perM[m]||0)+1; } });
    var lead=Object.keys(perM).map(function(m){return {m:m,c:perM[m]};}).sort(function(a,b){return b.c-a.c;}).slice(0,5);
    var mx=lead.length?lead[0].c:1;
    var leadBody=lead.length? lead.map(function(r,i){
      return '<div class="unrow"><div class="rank'+(i===0?" top":"")+'">'+(i+1)+'</div>'+
        '<div><div class="mach">'+esc(r.m)+'</div><div class="u">USB\'ye kopyalama</div></div>'+
        '<div class="prodw"><div class="prodt"><span>Kopyalanan dosya</span><span class="num">'+r.c+'</span></div><div class="prodbar"><i style="width:'+Math.round(r.c/mx*100)+'%;background:var(--crit)"></i></div></div>'+
        '<div class="vscore" style="background:var(--crit-d);color:var(--crit)">'+r.c+'</div></div>';
    }).join("") : '<div class="empty"><b>Temiz</b>Hiçbir makinede USB\'ye dosya kopyalama görülmedi.</div>';
    var leadPanel='<div class="panel"><div class="ph"><b>USB\'ye En Çok Veri Taşıyanlar</b><span class="bd">makine bazında</span></div>'+leadBody+'</div>';

    var feed=da.length? da.slice(0,8).map(alertRow).join("") : '<div class="empty"><b>DLP uyarısı yok</b>Toplu kopyalama/silme veya USB sızıntısı tetiklenince burada görünür.</div>';
    var feedPanel='<div class="panel"><div class="ph"><b>Veri Güvenliği Uyarıları</b><button class="link" data-go="uyarilar">Tümü →</button></div><div class="feed">'+feed+'</div></div>';

    var srows=se.slice(0,500).map(function(e){
      return '<tr><td class="mono" style="font-size:11.5px">'+fmtTs(e.ts)+'</td><td class="time">'+ago(e.ts)+'</td><td>'+esc(e.machine)+'</td><td><span class="op '+esc(e.op)+'">'+opLabel(e.op)+'</span></td><td><span class="sens">⚠ '+esc(e.sensitivity)+'</span></td><td><span class="path">'+esc(e.path||"")+'</span></td></tr>';
    }).join("") || emptyRow(6,"Hassas içerik tespit edilmedi — TC kimlik / IBAN / kart içeren bir dosya oluşturup kopyalayın");
    var sensTbl='<div class="panel"><div class="ph"><b>Hassas İçerik Taşıma</b><span class="bd">içeriğinde TC kimlik · IBAN · kart · anahtar kelime bulunan dosyalar</span></div><div class="tw"><table><thead><tr><th>Zaman Damgası</th><th>Ne zaman</th><th>Makine</th><th>İşlem</th><th>Hassas Veri</th><th>Dosya Yolu</th></tr></thead><tbody>'+srows+'</tbody></table></div></div>';

    var rows=ue.slice(0,500).map(function(e){
      return '<tr data-op="'+esc(e.op)+'"><td class="mono" style="font-size:11.5px">'+fmtTs(e.ts)+'</td><td class="time">'+ago(e.ts)+'</td><td>'+esc(e.machine)+'</td><td><span class="op '+esc(e.op)+'">'+opLabel(e.op)+'</span></td><td>'+fileCell(e)+'</td></tr>';
    }).join("") || emptyRow(5,"Bu kişi/aralıkta USB hareketi yok — tarih aralığını genişletmeyi deneyin");
    var tbl='<div class="panel"><div class="ph"><b>USB Olay Akışı</b><span class="bd">takılma · çıkarılma · medyaya kopyalama · seçili aralık</span></div><div class="tw"><table><thead><tr><th>Zaman Damgası</th><th>Ne zaman</th><th>Makine</th><th>Olay</th><th>Yol / Aygıt</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

    document.getElementById("dlpBody").innerHTML=
      risk+kpis+usbPolicyPanel()+'<div class="grid">'+leadPanel+feedPanel+'</div>'+sensTbl+tbl;
    bindDynamic(); applyFilters();
  }

  // USB politikası UYGULAMA DURUMU — "engelle dedim ama tuttu mu?" sorusunun cevabı.
  // Agent, SYSTEM servisinin registry'ye gerçekten yazdığı politikayı geri bildirir (usbPolicy).
  function usbPolicyLabel(p){
    return {block:"Engelli",readonly:"Salt-okunur",allow:"Serbest"}[p||""]||"Bilinmiyor";
  }
  function usbPolicyPanel(){
    var want=(state.settings&&state.settings.usbAccess)||"";
    if(!want) return "";
    var ag=state.agents||[];
    if(!ag.length) return "";
    var applied=ag.filter(function(a){ return (a.usbPolicy||"")===want; }).length;
    var pending=ag.filter(function(a){ return (a.usbPolicy||"")!==want; });
    var ok=pending.length===0;
    var list=pending.slice(0,12).map(function(a){
      return '<tr><td>'+esc(a.machine)+'</td><td class="u">'+esc(a.user||"")+'</td><td>'+
        (a.online?'<span class="chip info">çevrimiçi</span>':'<span class="chip">çevrimdışı</span>')+'</td><td>'+
        '<span class="chip '+(a.usbPolicy?"warning":"")+'">'+esc(usbPolicyLabel(a.usbPolicy))+'</span></td></tr>';
    }).join("");
    var body= ok
      ? '<div class="empty"><b>Politika tüm uç noktalarda uygulandı</b>'+applied+'/'+ag.length+' makinede USB durumu: '+usbPolicyLabel(want)+'</div>'
      : '<div class="tw"><table><thead><tr><th>Makine</th><th>Kullanıcı</th><th>Durum</th><th>Uygulanan</th></tr></thead><tbody>'+list+'</tbody></table></div>'+
        '<div class="empty" style="padding-top:0">Çevrimdışı makineler açılıp agent sunucuya bağlanınca uygular. Eski agent sürümü bu bilgiyi hiç göndermez → "Bilinmiyor" görünür.</div>';
    return '<div class="panel"><div class="ph"><b>USB Politikası — Uygulama Durumu</b>'+
      '<span class="bd">istenen: '+usbPolicyLabel(want)+' · uygulandı: '+applied+'/'+ag.length+'</span></div>'+body+'</div>';
  }

  function headHtml(title,sub,segs,vname,cat){
    var btns=segs.map(function(s,i){ return '<button class="'+(i===0?"on":"")+'" data-seg="'+vname+'" data-cat="'+(s[1]===null?"":s[1])+'">'+s[0]+'</button>'; }).join("");
    return '<div class="head"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="seg" data-cat-field="'+cat+'">'+btns+'</div></div>';
  }

  // ---------- AYARLAR ----------
  function nrow(id,label,val,hint){
    return '<div class="frow"><label>'+label+'<span class="fh">'+hint+'</span></label><input type="number" id="set-'+id+'" value="'+(val==null?"":val)+'" min="0" step="1"></div>';
  }
  function ayarHead(){
    return '<div class="head"><div><h1>Ayarlar</h1><div class="sub">Tenant politikası · eşikler, dosya izleme motoru ve agent davranışı. Kaydedince agent bir sonraki turda uygular.</div></div></div>';
  }
  function renderAyarlar(){
    var v=document.getElementById("v-ayarlar");
    v.innerHTML=ayarHead()+'<div class="empty">Yükleniyor…</div>';
    api("/settings").then(function(s){
      var monSel=function(val){ return ["auto","usn","fsw"].map(function(m){ var lbl={auto:"Otomatik (USN varsa, yoksa FSW)",usn:"USN Journal (güvenilir, admin ister)",fsw:"FileSystemWatcher (yedek)"}[m]; return '<option value="'+m+'"'+(val===m?" selected":"")+'>'+lbl+'</option>'; }).join(""); };
      var sevSel=function(val){ return ["critical","warning","info"].map(function(m){ var lbl={critical:"Yalnız Kritik (önerilen)",warning:"Uyarı ve üstü",info:"Hepsi (bilgi dahil)"}[m]; return '<option value="'+m+'"'+(val===m?" selected":"")+'>'+lbl+'</option>'; }).join(""); };
      var usbAccessSel=function(val){ return ["allow","readonly","block"].map(function(m){ var lbl={allow:"Serbest — okuma ve yazma açık",readonly:"Salt-okunur — yazma KAPALI (önerilen)",block:"Engelli — hiç bağlanmaz"}[m]; return '<option value="'+m+'"'+(val===m?" selected":"")+'>'+lbl+'</option>'; }).join(""); };
      var folders=(s.watchFolders&&s.watchFolders.length)? s.watchFolders.join("\n") : "";
      var html=ayarHead()+
        '<div class="panel"><div class="ph"><b>Uyarı Eşikleri (DLP)</b><span class="bd">kayan pencerede tetiklenir</span></div><div class="fgrid">'+
          nrow("del","Toplu silme eşiği",s.deleteThreshold,"N silme → uyarı")+
          nrow("cop","Toplu kopyalama eşiği",s.copyThreshold,"N kopyalama → uyarı")+
          nrow("usb","USB sızıntı eşiği",s.usbThreshold,"USB'ye N kopyalama → uyarı")+
          nrow("sens","Hassas sızıntı eşiği",s.sensitiveThreshold,"N hassas dosya taşınınca → uyarı")+
          nrow("win","Pencere (sn)",s.windowSeconds,"kayan zaman penceresi")+
          nrow("cool","Bekleme (sn)",s.cooldownSeconds,"aynı uyarı tekrarı arası")+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>Hassas İçerik Taraması (DLP)</b><span class="bd">PDF · Office (yeni+eski) · ZIP içi · düz metin · TC/IBAN/kart doğrulamalı</span></div><div class="fgrid">'+
          '<div class="frow"><label>İçerik taraması<span class="fh">TC/IBAN/kart + anahtar kelime</span></label><label class="toggle"><input type="checkbox" id="set-scan"'+(s.contentScan?" checked":"")+'> Açık</label></div>'+
          nrow("scanmb","Tarama boyut tavanı (MB)",s.contentScanMaxMb==null?32:s.contentScanMaxMb,"bu boyutun üstü taranmaz · 1-512")+
          '<div class="frow"><label>Arşiv içi tarama<span class="fh">ZIP içine girer — "zip\'le ve USB\'ye at" yolunu kapatır</span></label><label class="toggle"><input type="checkbox" id="set-arch"'+(s.scanArchives!==false?" checked":"")+'> Açık</label></div>'+
          '<div class="frow"><label>Şifreli dosya sinyali<span class="fh">parola korumalı / açılamayan dosya (rar, 7z, şifreli zip) sızıntı sinyali sayılsın</span></label><label class="toggle"><input type="checkbox" id="set-enc"'+(s.flagEncrypted!==false?" checked":"")+'> Açık</label></div>'+
          '<div class="frow wide"><label>Anahtar kelimeler<span class="fh">her satıra bir kelime · içerikte geçince hassas sayılır (ör. gizli, maaş, sözleşme)</span></label><textarea id="set-keywords" placeholder="gizli&#10;confidential&#10;maaş">'+esc((s.sensitiveKeywords&&s.sensitiveKeywords.length)?s.sensitiveKeywords.join("\n"):"")+'</textarea></div>'+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>Dosya İzleme Motoru</b><span class="bd">değişiklik agent yeniden başlayınca geçerli</span></div><div class="fgrid">'+
          '<div class="frow"><label>Motor<span class="fh">olay yakalama yöntemi</span></label><select id="set-mon">'+monSel(s.fileMonitor||"auto")+'</select></div>'+
          '<div class="frow"><label>USB izleme<span class="fh">harici medya olayları</span></label><label class="toggle"><input type="checkbox" id="set-usbon"'+(s.usbMonitoring?" checked":"")+'> Açık</label></div>'+
          '<div class="frow wide"><label>İzlenen klasörler<span class="fh">her satıra bir yol · boşsa Masaüstü + Belgeler</span></label><textarea id="set-folders" placeholder="C:\\Users\\...\\Desktop&#10;\\\\Sunucu\\Ortak">'+esc(folders)+'</textarea></div>'+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>USB Depolama Engelleme (Uygulama)</b><span class="bd">flash bellek / harici disk / telefon — çalışan veri kopyalayamaz</span></div><div class="fgrid">'+
          '<div class="frow"><label>USB depolama<span class="fh">Salt-okunur = takılır, okunur ama YAZILAMAZ (sızıntıyı durdurur, kullanıcıyı mağdur etmez) · Engelli = hiç açılmaz · mouse/klavye/webcam etkilenmez · ~15 sn içinde tüm makinelere iner</span></label><select id="set-usbaccess">'+usbAccessSel(s.usbAccess||(s.usbBlocked?"block":"allow"))+'</select></div>'+
          '<div class="frow"><label>Uygulama durumu<span class="fh">politikanın makinelerde tuttuğunu Veri Güvenliği ekranından doğrulayın</span></label><button class="btn" data-go="guvenlik">Veri Güvenliği →</button></div>'+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>Uyarı Bildirimi</b><span class="bd">kritik olayda paneli beklemeden haber ver · SMTP sunucu tarafında yapılandırılır</span></div><div class="fgrid">'+
          '<div class="frow wide"><label>E-posta alıcıları<span class="fh">virgülle ayır · boş bırakılırsa e-posta gönderilmez</span></label><input type="text" id="set-mailto" value="'+esc(s.notifyEmailTo||"")+'" placeholder="bt@firma.com, guvenlik@firma.com"></div>'+
          '<div class="frow wide"><label>Webhook adresi<span class="fh">Slack / Teams / kendi ucunuz · JSON POST edilir</span></label><input type="text" id="set-hook" value="'+esc(s.notifyWebhookUrl||"")+'" placeholder="https://hooks.slack.com/services/..."></div>'+
          '<div class="frow"><label>En düşük önem<span class="fh">bu seviyeden itibaren bildirilir</span></label><select id="set-minsev">'+sevSel(s.notifyMinSeverity||"critical")+'</select></div>'+
          '<div class="frow"><label>Bildirim aralığı<span class="fh">60 sn\'de bir toplu gönderilir · aynı tipte 10 dk bekleme (uyarı yağmuru olmaz)</span></label><span class="u">otomatik</span></div>'+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>Veri Saklama</b><span class="bd">eski telemetriyi otomatik sil · firma/kullanıcı/lisans kayıtları etkilenmez</span></div><div class="fgrid">'+
          nrow("ret","Saklama süresi (gün)",s.retentionDays==null?0:s.retentionDays,"0 = sınırsız · günde bir temizlenir · KVKK saklama süresiyle uyumlu seçin")+
        '</div></div>'+
        '<div class="panel"><div class="ph"><b>Agent Davranışı</b></div><div class="fgrid">'+
          nrow("send","Gönderim aralığı (sn)",s.sendSeconds,"telemetri sıklığı · min 5")+
          nrow("idle","Boşta eşiği (sn)",s.idleThresholdSeconds,"giriş yoksa boşta say")+
        '</div>'+
        '<div class="savebar"><button class="btn" id="set-save">Kaydet</button><span class="msg" id="set-msg">'+(s.updatedAt?"Son güncelleme: "+fmtTs(s.updatedAt):"Henüz özelleştirilmedi (varsayılanlar)")+'</span></div></div>';
      v.innerHTML=html;
      document.getElementById("set-save").onclick=saveAyarlar;
      bindDynamic();   // "Veri Güvenliği →" gibi data-go düğmeleri çalışsın
    }).catch(function(e){ v.innerHTML=ayarHead()+'<div class="empty">Ayarlar yüklenemedi ('+e.message+')</div>'; });
  }
  function numOf(id,def){ var el=document.getElementById("set-"+id); var n=parseInt(el&&el.value,10); return isNaN(n)?def:n; }
  function saveAyarlar(){
    var msg=document.getElementById("set-msg"), btn=document.getElementById("set-save");
    var folders=(document.getElementById("set-folders").value||"").split("\n").map(function(x){return x.trim();}).filter(function(x){return x.length;});
    var keywords=(document.getElementById("set-keywords").value||"").split("\n").map(function(x){return x.trim();}).filter(function(x){return x.length;});
    var body={
      deleteThreshold:numOf("del",10), copyThreshold:numOf("cop",15), usbThreshold:numOf("usb",3),
      sensitiveThreshold:Math.max(1,numOf("sens",1)),
      windowSeconds:numOf("win",30), cooldownSeconds:numOf("cool",60),
      sendSeconds:Math.max(5,numOf("send",15)), idleThresholdSeconds:Math.max(5,numOf("idle",60)),
      fileMonitor:document.getElementById("set-mon").value,
      usbMonitoring:document.getElementById("set-usbon").checked,
      usbAccess:document.getElementById("set-usbaccess").value,
      usbBlocked:document.getElementById("set-usbaccess").value==="block",   // eski agent'lar için geriye uyum
      contentScan:document.getElementById("set-scan").checked,
      contentScanMaxMb:Math.min(512,Math.max(1,numOf("scanmb",32))),
      scanArchives:document.getElementById("set-arch").checked,
      flagEncrypted:document.getElementById("set-enc").checked,
      watchFolders:folders,
      sensitiveKeywords:keywords,
      notifyEmailTo:(document.getElementById("set-mailto").value||"").trim(),
      notifyWebhookUrl:(document.getElementById("set-hook").value||"").trim(),
      notifyMinSeverity:document.getElementById("set-minsev").value,
      retentionDays:Math.max(0,numOf("ret",0))
    };
    btn.disabled=true; msg.textContent="Kaydediliyor…";
    apiSend("/settings","PUT",body).then(function(s){
      btn.disabled=false; msg.textContent="Kaydedildi ✓  ("+fmtTs(s.updatedAt)+") — agent bir sonraki turda uygular.";
    }).catch(function(e){ btn.disabled=false; msg.textContent="Kaydedilemedi ("+e.message+")"; });
  }

  // ---------- drawer ----------
  function openAgent(id,machine){
    var d=document.getElementById("drawer"), body=document.getElementById("dBody");
    document.getElementById("dTitle").textContent=machine||"Uç Nokta";
    body.innerHTML='<div class="empty">yükleniyor…</div>';
    d.classList.add("open");
    var st={id:id, from:daysAgo(29), to:today(), q:"", tab:"web", summary:null, web:[]};
    function reloadWeb(){ return api("/report/web?agent="+encodeURIComponent(id)+"&from="+st.from+"&to="+st.to).then(function(r){ st.web=r||[]; },function(){ st.web=[]; }); }
    function match(t){ return !st.q || (t||"").toLowerCase().indexOf(st.q.toLowerCase())>=0; }
    api("/agents/"+id+"/activity").then(function(s){ st.summary=s; return reloadWeb(); }, function(){ return reloadWeb(); }).then(draw)
      .catch(function(){ body.innerHTML='<div class="empty">Veri bulunamadı.</div>'; });

    function draw(){
      var s=st.summary||{totalActiveSeconds:0,totalIdleSeconds:0,fileDeletes:0,fileCopies:0,alertCount:0,apps:[]};
      var stats='<div class="kpis" style="grid-template-columns:1fr 1fr;padding:16px 18px 8px;margin:0">'+
        kpi("Aktif Süre",fmt(s.totalActiveSeconds),"bu oturum","var(--accent)")+kpi("Boşta",fmt(s.totalIdleSeconds),"bu oturum")+'</div>'+
        '<div class="kpis" style="grid-template-columns:1fr 1fr 1fr;padding:0 18px 10px;margin:0">'+
        kpi("Silinen",s.fileDeletes||0,"dosya",(s.fileDeletes)?"var(--warn)":"var(--text)")+kpi("Kopyalanan",s.fileCopies||0,"dosya",(s.fileCopies)?"var(--info)":"var(--text)")+kpi("Uyarı",s.alertCount||0,"",(s.alertCount)?"var(--crit)":"var(--text)")+'</div>';
      var tool='<div class="dtool"><input type="date" class="dd-from" value="'+st.from+'"><span class="u">—</span><input type="date" class="dd-to" value="'+st.to+'">'+
        '<div class="db-presets"><button data-days="0">Bugün</button><button data-days="6">7g</button><button data-days="29">30g</button></div>'+
        '<input class="dd-q" placeholder="Ara: kelime · site · dosya…" value="'+esc(st.q)+'"></div>';
      var tabs='<div class="subtabs"><button class="subtab" data-p="web">Web <span class="c">0</span></button>'+
        '<button class="subtab" data-p="apps">Uygulama <span class="c">0</span></button>'+
        '<button class="subtab" data-p="files">Dosya <span class="c">0</span></button></div>';
      body.innerHTML=stats+tool+tabs+'<div class="dpanes"></div>';
      body.querySelector(".dd-from").onchange=function(){ st.from=this.value; reloadWeb().then(renderPanes); };
      body.querySelector(".dd-to").onchange=function(){ st.to=this.value; reloadWeb().then(renderPanes); };
      body.querySelectorAll(".db-presets button").forEach(function(b){ b.onclick=function(){ var dd=+b.getAttribute("data-days"); st.from=daysAgo(dd); st.to=today(); body.querySelector(".dd-from").value=st.from; body.querySelector(".dd-to").value=st.to; reloadWeb().then(renderPanes); }; });
      body.querySelector(".dd-q").oninput=function(){ st.q=this.value; renderPanes(); };
      body.querySelectorAll(".subtab").forEach(function(b){ b.onclick=function(){ st.tab=b.getAttribute("data-p"); flip(); }; });
      renderPanes();
    }
    function flip(){
      body.querySelectorAll(".subtab").forEach(function(x){ x.classList.toggle("on",x.getAttribute("data-p")===st.tab); });
      body.querySelectorAll(".subpane").forEach(function(x){ x.classList.toggle("on",x.getAttribute("data-p")===st.tab); });
    }
    function renderPanes(){
      var s=st.summary||{apps:[]};
      var apps=(s.apps||[]).filter(function(a){ return match(a.app)||match(a.exe); });
      var maxA=apps.reduce(function(m,a){ return Math.max(m,a.activeSeconds); },1);
      var web=st.web.filter(function(w){ return match(webLabel(w))||match(w.domain)||match(w.url)||match(w.site)||match(w.title); });
      var files=state.events.filter(function(e){ if(e.agentId!==id) return false; var day=(e.ts||"").slice(0,10); if(day&&(day<st.from||day>st.to)) return false; return match(e.path)||match(opLabel(e.op))||match(e.sensitivity); });
      function setc(p,n){ var el=body.querySelector('.subtab[data-p="'+p+'"] .c'); if(el) el.textContent=n; }
      setc("web",web.length); setc("apps",apps.length); setc("files",files.length);
      var pW='<div class="subpane" data-p="web">'+(web.length? web.map(function(w){ var lbl=webLabel(w),href=webHref(w); var site=href?('<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(lbl)+'</a>'):('<span>'+esc(lbl)+'</span>'); return '<div class="wr"><div>'+site+' '+catBadge(w.domain||w.site)+'<div class="tt">'+esc((w.lastTs?fmtTs(w.lastTs):"")+(w.domain?" · "+w.domain:""))+'</div></div>'+(w.incognito?'<span class="incog">Gizli</span>':'')+'<span class="wt">'+fmt(w.seconds)+'</span></div>'; }).join("") : '<div class="empty">'+(st.q?'"'+esc(st.q)+'" ile eşleşen site yok':'Bu aralıkta web verisi yok')+'</div>')+'</div>';
      var pA='<div class="subpane" data-p="apps">'+(apps.length? '<div class="apps">'+apps.slice(0,20).map(function(a){ return '<div class="aw"><div class="top"><span class="n">'+esc(a.app)+'</span><span class="t">'+fmt(a.activeSeconds)+'</span></div><div class="tr"><i style="width:'+Math.round(a.activeSeconds/maxA*100)+'%"></i></div></div>'; }).join("")+'</div>' : '<div class="empty">'+(st.q?'eşleşen uygulama yok':'Uygulama verisi yok (bu oturum).')+'</div>')+'</div>';
      var pF='<div class="subpane" data-p="files">'+(files.length? '<div class="tw"><table><tbody>'+files.slice(0,80).map(function(e){ return '<tr><td class="time">'+ago(e.ts)+'</td><td><span class="op '+esc(e.op)+'">'+opLabel(e.op)+'</span></td><td>'+fileCell(e)+sensBadge(e)+'</td></tr>'; }).join("")+'</tbody></table></div>' : '<div class="empty">'+(st.q?'eşleşen dosya olayı yok':'Bu aralıkta dosya olayı yok.')+'</div>')+'</div>';
      body.querySelector(".dpanes").innerHTML=pW+pA+pF;
      flip();
    }
  }

  // ---------- PATRON / YÖNETİCİ ÖZETİ ----------
  function renderOzet(){
    var ag=state.agents||[], al=state.alerts||[], ev=state.events||[];
    var endpoints=ag.length, online=ag.filter(function(a){return a.online;}).length;
    var tActive=ag.reduce(function(s,a){return s+(a.activeSeconds||0);},0);
    var tIdle=ag.reduce(function(s,a){return s+(a.idleSeconds||0);},0);
    var wpct=(tActive+tIdle)>0?Math.round(100*tActive/(tActive+tIdle)):0;
    function ct(t){ return al.filter(function(a){return a.alert&&a.alert.type===t;}).length; }
    var sensN=ev.filter(function(e){return e.sensitivity;}).length;
    var per={};
    ev.forEach(function(e){ var id=e.agentId||"?"; if(!per[id])per[id]={sens:0,usb:0}; if(e.sensitivity)per[id].sens++; if(e.op==="usb_copy")per[id].usb++; });
    var risk=ag.map(function(a){ var p=per[a.agentId]||{sens:0,usb:0}; return {a:a,score:p.sens*5+p.usb*3+(a.alertCount||0)*2,sens:p.sens,usb:p.usb}; })
      .filter(function(r){return r.score>0;}).sort(function(x,y){return y.score-x.score;}).slice(0,6);
    var withData=ag.filter(function(a){return (a.activeSeconds||0)+(a.idleSeconds||0)>0;});
    var most=withData.slice().sort(function(x,y){return y.activeSeconds-x.activeSeconds;}).slice(0,5);
    var least=withData.slice().sort(function(x,y){return x.activeSeconds-y.activeSeconds;}).slice(0,5);
    var webN=ct("web_policy");
    var dlp=ct("sensitive_exfil")+ct("usb_exfil")+ct("mass_delete")+ct("mass_copy")+webN;
    // Son yasaklı/riskli site uyarıları (kim + hangi site)
    var webHits=al.filter(function(a){return a.alert&&a.alert.type==="web_policy";}).slice(0,4);
    var webBanner = webN>0 ? '<div class="risk high" style="margin-bottom:14px"><div class="rico">⛔</div><div><div class="rt">'+webN+' yasaklı / riskli site ziyareti</div><div class="rd">'+webHits.map(function(a){return esc((a.machine||"")+" — "+a.alert.detail);}).join(" · ")+'</div></div><div class="rlvl">Dikkat</div></div>' : '';

    var kpis='<div class="kpis">'+
      kpi("Uç Nokta",endpoints,online+" çevrimiçi · "+(endpoints-online)+" çevrimdışı","var(--text)")+
      kpi("İş Gücü Aktifliği","%"+wpct,fmt(tActive)+" aktif / "+fmt(tIdle)+" boşta",wpct>=50?"var(--good)":"var(--warn)")+
      kpi("DLP Olayı",dlp,"hassas/USB/toplu uyarı",dlp?"var(--crit)":"var(--text)")+
      kpi("Hassas Dosya",sensN,"içerikte TC/IBAN/kart",sensN?"var(--crit)":"var(--text)")+'</div>';

    var riskBody=risk.length? risk.map(function(r,i){
      return '<tr class="click" data-id="'+esc(r.a.agentId)+'" data-machine="'+esc(r.a.machine)+'"><td><div class="rank'+(i===0?" top":"")+'" style="display:inline-flex">'+(i+1)+'</div></td>'+
        '<td>'+esc(r.a.machine)+'<div class="u">'+esc(r.a.user||"")+'</div></td>'+
        '<td class="num u">'+r.sens+'</td><td class="num u">'+r.usb+'</td><td class="num u">'+(r.a.alertCount||0)+'</td>'+
        '<td><span class="vscore" style="background:var(--crit-d);color:var(--crit)">'+r.score+'</span></td></tr>';
    }).join("") : emptyRow(6,"Risk sinyali yok — temiz");
    var riskPanel='<div class="panel"><div class="ph"><b>En Riskli Uç Noktalar</b><span class="bd">hassas·USB·uyarı ağırlıklı skor</span></div><div class="tw"><table><thead><tr><th>#</th><th>Makine</th><th>Hassas</th><th>USB</th><th>Uyarı</th><th>Skor</th></tr></thead><tbody>'+riskBody+'</tbody></table></div></div>';

    function plist(list){ return list.length? list.map(function(a){ var t=(a.activeSeconds||0)+(a.idleSeconds||0); var p=t>0?Math.round(100*a.activeSeconds/t):0;
      return '<div class="aw" style="margin-bottom:11px"><div class="top"><span class="n">'+esc(a.machine)+' <span class="u">'+esc(a.user||"")+'</span></span><span class="t">'+fmt(a.activeSeconds)+' · %'+p+'</span></div><div class="tr"><i style="width:'+p+'%"></i></div></div>'; }).join("") : '<div class="empty">Veri yok</div>'; }
    var actPanel='<div class="panel"><div class="ph"><b>En Aktif Personel</b></div>'+plist(most)+'</div>';
    var lazyPanel='<div class="panel"><div class="ph"><b>En Az Aktif Personel</b></div>'+plist(least)+'</div>';

    document.getElementById("v-ozet").innerHTML=
      '<div class="head"><div><h1>Yönetim</h1><div class="sub">Tüm şirket tek bakışta · '+esc(me.displayName||me.username)+', hoş geldiniz</div></div></div>'+
      webBanner+kpis+riskPanel+'<div class="grid">'+actPanel+lazyPanel+'</div>';
  }

  // ---------- AGENT YÖNETİMİ ----------
  function agentActions(a){
    var cmd=a.command||"active", id=a.agentId;
    if(cmd==="remove") return '<button class="abtn go" data-acmd="active" data-id="'+id+'">Kaldırmayı iptal</button>';
    var b="";
    if(cmd==="disabled") b+='<button class="abtn go" data-acmd="active" data-id="'+id+'">Devam ettir</button>';
    else b+='<button class="abtn" data-acmd="disabled" data-id="'+id+'">Durdur</button>';
    b+='<button class="abtn danger" data-acmd="remove" data-id="'+id+'">Kaldır</button>';
    return b;
  }
  function downloadPanel(){
    var origin=window.location.origin;
    var key=me.tenantKey||"FIRMA_ANAHTARI";
    var cmd='powershell -ExecutionPolicy Bypass -File install.ps1 -ServerUrl "'+origin+'" -TenantKey "'+key+'"';
    return '<div class="panel"><div class="ph"><b>Agent Kurulumu & Dağıtımı</b><span class="bd">paketi indir → dağıt</span></div>'+
      '<div style="padding:2px">'+
      '<div style="margin-bottom:14px"><a class="btn" href="/download/argus-agent.zip" download style="text-decoration:none;display:inline-block">⬇ Agent Paketini İndir (ZIP)</a></div>'+
      '<div class="sub" style="margin-bottom:8px">ZIP\'i hedef makineye kopyalayıp çıkarın; <b>Yönetici PowerShell</b>\'de o klasörde şu komutu çalıştırın (adres ve firma anahtarınız hazır):</div>'+
      '<div class="codebox">'+esc(cmd)+'</div>'+
      '<div class="sub" style="margin-top:12px"><b>Active Directory / GPO ile otomatik dağıtım:</b> aynı komutu bir <b>başlangıç betiği</b> olarak GPO\'ya ekleyin; alan denetleyicisi tüm makinelere sessizce kurar. Agent gizli çalışır, kullanıcı kapatamaz/silemez; buradan <b>Kaldır</b> ile uzaktan sökülür, öldürülürse yeniden başlar.</div>'+
      (me.tenantKey?'':'<div class="sub" style="margin-top:8px;color:var(--warn)">Not: Firma anahtarını görmek için Yönetici/Patron rolü gerekir.</div>')+
      '</div></div>';

  function renderAgentlar(){
    var ag=state.agents||[], isAdmin=(roleRank(me.role)>=2);  // admin, owner, superadmin
    var rows=ag.map(function(a){
