        var lic = t.expired
          ? '<span class="rolepill" style="background:var(--crit-d);color:var(--crit)">SÜRESİ DOLDU</span>'
          : '<span class="'+(seatFull?"rolepill":"u")+'"'+(seatFull?' style="background:var(--warn-d);color:var(--warn)"':'')+'>'+seat+'</span>'
            + (t.expiresAt? ' <span class="u2">→ '+fmtTs(t.expiresAt).split(" ")[0]+'</span>' : ' <span class="u2">süresiz</span>');
        var acts='<button class="abtn" data-tlic="'+t.id+'" data-tseat="'+(t.seatLimit||0)+'" data-texp="'+(t.expiresAt?fmtTs(t.expiresAt).split(" ")[0].split(".").reverse().join("-"):"")+'">Lisans</button>'+
          '<button class="abtn" data-tren="'+t.id+'" data-tname="'+esc(t.name)+'">Ad</button>'+
          '<button class="abtn danger" data-tdel="'+t.id+'" data-tname="'+esc(t.name)+'">Sil</button>';
        return '<tr><td>'+esc(t.name)+'</td><td><span class="codebox" style="display:inline-block;padding:3px 9px;user-select:all" title="Agent kurulumunda -TenantKey olarak kullanılır">'+esc(t.key)+'</span></td><td class="num u">'+t.agents+'</td><td class="num u">'+t.users+'</td><td>'+lic+'</td><td class="time">'+fmtTs(t.createdAt)+'</td><td>'+acts+'</td></tr>';
      }).join("")||emptyRow(7,"Henüz firma yok — aşağıdan ekleyin");
      v.innerHTML='<div class="head"><div><h1>Firmalar</h1><div class="sub">Müşteri firmalar · her firmaya özel anahtar (agent bu anahtarla bağlanır)</div></div></div>'+
        '<div class="panel"><div class="ph"><b>Yeni Firma Oluştur</b><span class="bd">firma + ilk yönetici hesabı</span></div><div class="fgrid">'+
          '<div class="frow"><label>Firma adı</label><input id="nt-name" placeholder="ABC Ltd. Şti."></div>'+
          '<div class="frow"><label>Yönetici kullanıcı adı<span class="fh">bu kişi firmanın patronu olur</span></label><input id="nt-user" placeholder="abc-patron"></div>'+
          '<div class="frow"><label>Yönetici parolası<span class="fh">ilk girişte değiştirilir</span></label><input id="nt-pass" type="password"></div>'+
          '<div class="frow"><label>Yönetici ad soyad</label><input id="nt-dn" placeholder="Ali Veli"></div>'+
        '</div><div class="savebar"><button class="btn" id="nt-add">Firma Oluştur</button><span class="msg" id="nt-msg"></span></div></div>'+
        '<div class="panel"><div class="ph"><b>Kayıtlı Firmalar</b><span class="bd">'+list.length+' firma</span></div><div class="tw"><table><thead><tr><th>Firma</th><th>Tenant Anahtarı</th><th>Agent</th><th>Kullanıcı</th><th>Lisans (koltuk · bitiş)</th><th>Oluşturma</th><th>İşlem</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
      document.querySelectorAll("#v-firmalar [data-tren]").forEach(function(b){ b.onclick=function(){
        var nn=prompt("Firma için yeni ad:",b.getAttribute("data-tname")); if(!nn||!nn.trim()) return;
        apiSend("/tenants/"+b.getAttribute("data-tren"),"PUT",{name:nn.trim(),ownerUsername:"",ownerPassword:""}).then(renderFirmalar).catch(function(e){ alert("Hata: "+e.message); });
      }; });
      document.querySelectorAll("#v-firmalar [data-tdel]").forEach(function(b){ b.onclick=function(){
        if(!confirm('"'+b.getAttribute("data-tname")+'" firması ve TÜM verisi (agent, olay, uyarı, kullanıcı) kalıcı silinecek. Emin misiniz?')) return;
        apiSend("/tenants/"+b.getAttribute("data-tdel"),"DELETE",null).then(renderFirmalar).catch(function(e){ alert("Silinemedi: "+e.message); });
      }; });
      document.querySelectorAll("#v-firmalar [data-tlic]").forEach(function(b){ b.onclick=function(){
        var seat=prompt("Koltuk (uç nokta) limiti — 0 = sınırsız:",b.getAttribute("data-tseat")); if(seat===null) return;
        seat=parseInt(seat,10); if(isNaN(seat)||seat<0){ alert("Geçersiz sayı"); return; }
        var exp=prompt("Bitiş tarihi (YYYY-AA-GG) — boş = süresiz:",b.getAttribute("data-texp")); if(exp===null) return;
        apiSend("/tenants/"+b.getAttribute("data-tlic")+"/license","PUT",{seatLimit:seat,expiresAt:exp.trim()}).then(renderFirmalar).catch(function(e){ alert("Hata: "+e.message); });
      }; });
      document.getElementById("nt-add").onclick=function(){
        var body={name:uval("nt-name"),ownerUsername:uval("nt-user"),ownerPassword:uval("nt-pass"),ownerDisplayName:uval("nt-dn")};
        var msg=document.getElementById("nt-msg");
        if(!body.name||!body.ownerUsername||!body.ownerPassword){ msg.textContent="Firma adı, kullanıcı adı ve parola gerekli"; return; }
        msg.textContent="Oluşturuluyor…";
        apiSend("/tenants","POST",body).then(function(r){
          alert("Firma oluşturuldu ✓\n\nFirma: "+r.name+"\nTenant Anahtarı:\n"+r.key+"\n\nBu anahtarı firmaya verin — agent'lar bu anahtarla kurulacak. (Anahtar aşağıdaki listede de duruyor.)");
          renderFirmalar();
        }).catch(function(e){ msg.textContent="Hata: "+e.message; });
      };
    }).catch(function(e){ if(e.message!=="401") v.querySelector(".empty").textContent="Yüklenemedi ("+e.message+")"; });
  }

  // ---------- SİSTEM GÜNLÜĞÜ (yalnız Platform) ----------
  function renderGunluk(){
    var v=document.getElementById("v-gunluk");
    v.innerHTML='<div class="head"><div><h1>Sistem Günlüğü</h1><div class="sub">Denetim kaydı · sunucu hataları · otomatik yedekler</div></div></div><div class="empty">Yükleniyor…</div>';
    api("/audit").then(function(d){
      var au=(d.audit||[]).map(function(l){ return '<tr><td class="mono" style="font-size:11.5px">'+esc(l)+'</td></tr>'; }).join("")||emptyRow(1,"Denetim kaydı yok");
      var er=(d.errors||[]).map(function(l){ return '<tr><td class="mono" style="font-size:11.5px;color:var(--crit)">'+esc(l)+'</td></tr>'; }).join("")||emptyRow(1,"Hata yok 🎉");
      var bk=(d.backups||[]).map(function(b){ return '<tr><td class="mono">'+esc(b.name)+'</td><td class="num u">'+b.sizeKb+' KB</td><td class="time">'+fmtTs(b.at)+'</td></tr>'; }).join("")||emptyRow(3,"Henüz yedek yok");
      v.innerHTML='<div class="head"><div><h1>Sistem Günlüğü</h1><div class="sub">Denetim kaydı · sunucu hataları · otomatik yedekler (bugün)</div></div><button class="btn" id="gk-ref">Yenile</button></div>'+
        '<div class="panel"><div class="ph"><b>Denetim Kaydı</b><span class="bd">kim ne yaptı · en yeni üstte</span></div><div class="tw"><table><tbody>'+au+'</tbody></table></div></div>'+
        '<div class="panel"><div class="ph"><b>Sunucu Hataları</b></div><div class="tw"><table><tbody>'+er+'</tbody></table></div></div>'+
        '<div class="panel"><div class="ph"><b>Otomatik Yedekler</b><span class="bd">son 14 · her 6 saatte bir</span></div><div class="tw"><table><thead><tr><th>Dosya</th><th>Boyut</th><th>Zaman</th></tr></thead><tbody>'+bk+'</tbody></table></div></div>';
      document.getElementById("gk-ref").onclick=renderGunluk;
    }).catch(function(e){ if(e.message!=="401") v.querySelector(".empty").textContent="Yüklenemedi ("+e.message+")"; });
  }

  // ---------- AKTİVİTE (Web / Uygulama / Belge / Rapor — alt sekmeli) ----------
  var aktSub="web";
  var aktFilter={person:"",from:daysAgo(29),to:today()};   // Aktivite sekmeleri ORTAK kişi/tarih filtresi
  function renderAktivite(sub){
    sub=sub||aktSub; aktSub=sub;
    document.querySelectorAll("#aktTabs .subtab").forEach(function(b){
      b.classList.toggle("on",b.getAttribute("data-sub")===sub);
      b.onclick=function(){ renderAktivite(b.getAttribute("data-sub")); };
    });
    ["web","uygulama","belge","rapor"].forEach(function(s){ var el=document.getElementById("v-"+s); if(el) el.style.display=(s===sub)?"":"none"; });
    if(sub==="web") renderWeb(); else if(sub==="uygulama") renderUygulama(); else if(sub==="belge") renderBelge(); else renderRapor();
  }

  // ---------- view switching + filters ----------
  // 5 sn'lik canlı yenileme YALNIZ anlık ekranları çizer. Uyarılar ve Veri Güvenliği artık
  // tarih filtreli geçmiş ekranı → her tikte yeniden çizilirse kullanıcının filtresi/kaydırması sıfırlanır.
  // Onlar ekrana girildiğinde ve "Uygula"ya basıldığında yüklenir.
  function renderAll(){ renderOzet(); renderPanel(); renderPersonel();
    if(view==="agentlar") renderAgentlar();
    if(view==="guvenlik") drawGuvenlik();   // canlı rozet/uygulama durumu tazelensin (veri yeniden çekilmez)
    var n=document.getElementById("navAlerts"); var c=state.alerts.length; n.textContent=c; n.style.display=c?"":"none";
    var da=state.alerts.filter(isDlpAlert).length;
    var nd=document.getElementById("navDlp"); if(nd){ nd.textContent=da; nd.style.display=da?"":"none"; }
    bindDynamic(); applyFilters();
  }
  function switchView(v){ view=v;
    if(v==="aktivite") renderAktivite(); else if(v==="ayarlar") renderAyarlar();
    else if(v==="agentlar") renderAgentlar(); else if(v==="kullanicilar") renderKullanicilar();
    else if(v==="dosya") renderDosya();
    else if(v==="uyarilar") renderUyarilar();
    else if(v==="guvenlik") renderGuvenlik();
    else if(v==="firmalar") renderFirmalar();
    else if(v==="gunluk") renderGunluk();
    document.querySelectorAll(".view").forEach(function(x){ x.classList.toggle("on",x.id==="v-"+v); });
    document.querySelectorAll(".nav-item").forEach(function(x){ x.classList.toggle("on",x.getAttribute("data-view")===v); });
    applyFilters(); window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav-item").forEach(function(b){ b.addEventListener("click",function(){ switchView(b.getAttribute("data-view")); }); });

  function bindDynamic(){
    document.querySelectorAll("tr.click, .unrow.click").forEach(function(r){ r.onclick=function(){ openAgent(r.getAttribute("data-id"),r.getAttribute("data-machine")); }; });
    document.querySelectorAll("[data-go]").forEach(function(b){ b.onclick=function(){ switchView(b.getAttribute("data-go")); }; });
    document.querySelectorAll(".seg button[data-seg]").forEach(function(b){ b.onclick=function(){
      var wrap=b.parentElement; wrap.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on");
      seg[b.getAttribute("data-seg")]={field:wrap.getAttribute("data-cat-field"),cat:b.getAttribute("data-cat")}; applyFilters();
    }; });
  }
  function applyFilters(){
    var v=document.getElementById("v-"+view); if(!v) return;
    var s=seg[view]||{}; var rows=v.querySelectorAll("tbody tr, .feed > .a");
    rows.forEach(function(r){
      if(r.classList.contains("ev-detail")) return;   // detay satırları eşlik eden ana satıra göre yönetilir
      var ok=true;
      if(gq && r.textContent.toLowerCase().indexOf(gq)<0) ok=false;
      if(ok && s.cat){ ok = s.cat==="sens" ? r.getAttribute("data-sens")==="1" : r.getAttribute("data-"+s.field)===s.cat; }
      r.style.display=ok?"":"none";
      if(r.classList.contains("ev-row")){ var d=r.nextElementSibling; if(d&&d.classList.contains("ev-detail")){ d.style.display=(ok&&openEv[r.getAttribute("data-k")])?"":"none"; } }
    });
  }

  function refresh(){
    if(!session) return;
    var soft=function(){ return null; };
    Promise.all([api("/agents"),api("/alerts"),api("/events"),api("/web"),api("/apps"),api("/appusage"),
                 api("/settings").catch(soft)]).then(function(res){
      state.agents=res[0]; state.alerts=res[1]; state.events=res[2]; state.web=res[3]; state.apps=res[4]; state.appusage=res[5];
      state.settings=res[6]||state.settings;
      pushHist(); renderAll(); setStatus(true);
    }).catch(function(e){ if(e.message!=="401") setStatus(false,"bağlanamadı ("+e.message+")"); });
  }

  var refreshTimer=null;
  function boot(){
    if(refreshTimer) clearInterval(refreshTimer);
    refresh(); refreshTimer=setInterval(refresh,5000);
  }
  // Açılış: kayıtlı oturumu doğrula; geçerliyse gir, değilse giriş ekranı.
  if(session){
    api("/auth/me").then(function(m){ me={role:m.role,displayName:m.displayName,username:m.username,tenantKey:m.tenantKey}; applyRole(); boot(); })
      .catch(function(){ showLogin(); });
  } else showLogin();
})();
</script>
</body>
</html>
